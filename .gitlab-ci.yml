name: Lint Check

on:
  push:
    branches-ignore:
      - "{excluded_branch_for_lint}"
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: "8.0"

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pylint flake8
          dotnet restore
          if [ ! -f "config/checkstyle/checkstyle.xml" ]; then
            echo '<?xml version="1.0"?>
              <!DOCTYPE module PUBLIC "-//Puppy Crawl//DTD Check Configuration 1.3//EN" "https://checkstyle.org/dtds/configuration_1_3.dtd">
              <module name="Checker">
                <module name="TreeWalker">
                  <module name="LineLength">
                    <property name="max" value="100"/>
                  </module>
                </module>
              </module>' > config/checkstyle/checkstyle.xml
          fi

      - name: Run Checkstyle for Java
        run: ./gradlew checkstyleMain

      - name: Run lint for C#
        run: |
          dotnet format --verify-no-changes || echo "C# linting issues found!"
          if [ ! -f ".editorconfig" ]; then
            echo "root = true
              [*]
              indent_style = space
              indent_size = 4
              max_line_length = 100" > .editorconfig
          fi

      - name: Run pylint for Python
        run: |
          pylint server.py || echo "Python linting issues found!"
          if [ ! -f ".pylintrc" ]; then
            echo "[FORMAT]
              max-line-length=100" > .pylintrc
          fi
